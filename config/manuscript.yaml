# Settings used for the manuscript. Input tables: see data/processed/README.md
#   python run_analysis.py config/manuscript.yaml
cv_file: data/processed/ML_inserted_boundarypairs_noLR.csv
ext_pos_file: data/processed/ML_positiveGenome_boundarypairs_noLR_ext.csv
ext_neg_file: data/processed/ML_negativeGenome_boundarypairs_noLR_ext.csv
metrics_file: data/processed/all_motifpairs_metrics_LRagnostic_reducedMotifs_tandemfixed_2tandem.csv
out_dir: results/manuscript

# Preselection
min_workA: 0.8
min_workB: 0.9
min_rep_ins: 3
min_freq_genome_or: 0.25
min_rep_genome_or: 5
min_rep_genome_anyor: 0

# Filtering, selection, tuning (defaults in pipeline.py, repeated for clarity)
var_threshold: 0.001
corr_threshold: 0.9
n_features: 40
n_splits: 5
random_state: 42
n_optuna_trials: 50
device: auto
